name: Mobile UI smoke tests
on:
  workflow_dispatch:
jobs:
  iphone-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p screenshots && (node server.mjs > /tmp/sourdough-server.log 2>&1 &)
      - run: |
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/api/health && break || sleep 1; done
          node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-layout-screenshots
          path: screenshots/
