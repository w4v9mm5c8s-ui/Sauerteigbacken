name: Sauerteig Buddy – Passwortanzeige auf dem iPhone
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/password-visibility-repair.yml'
      - 'scripts/apply_password_visibility_fix.py'
      - 'tests/password-visibility-browser.py'
      - 'password-visibility.js'
permissions:
  contents: read
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded UI-only correction
        run: python scripts/apply_password_visibility_fix.py
      - name: Existing build and tests
        run: |
          node --check password-visibility.js
          npm run build
      - name: Install browser engines
        run: |
          pip install playwright
          python -m playwright install chromium webkit --with-deps
      - name: Serve public modules on loopback only
        run: |
          python -m http.server 8080 --bind 127.0.0.1 >/tmp/password-ui-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/auth-ui.js >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify all five password controls without contacting auth provider
        run: |
          python tests/password-visibility-browser.py --base http://127.0.0.1:8080 --engine chromium
          python tests/password-visibility-browser.py --base http://127.0.0.1:8080 --engine webkit
      - name: Commit only tested app files
        run: |
          git diff --check
          git config user.name 'Sauerteig Buddy UI checks'
          git config user.email 'ui-checks@users.noreply.github.com'
          git add app.js style.css sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Safari password reveal for login and both reset confirmation fields'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > password-evidence/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-visibility-evidence
          path: password-evidence/
          retention-days: 5
